name: Update hero image
on:
  push:
    paths:
      - ".github/workflows/update-hero-image.yml"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace homepage hero image
        shell: bash
        run: |
          set -e
          test -f "assets/logowebsite.png"
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          pat=r'(<div class="hero-banner-live"><img[^>]*alt=")[^"]*("[^>]*src=")[^"]*("[^>]*></div>)'
          repl=r'\1Benjamin\'s New York Bar and Kitchen hero banner with realistic New York skyline, Benjamin Franklin logo, and Wall Street bull\2assets/logowebsite.png\3'
          s2,n=re.subn(pat,repl,s,count=1,flags=re.S)
          if n != 1:
              raise SystemExit(f"Expected one hero banner image, found {n}")
          p.write_text(s2,encoding="utf-8")
          PY
      - name: Commit homepage update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Use new realistic hero image"
            git push
          fi
