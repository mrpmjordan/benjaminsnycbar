name: Inspect drink images
on:
  push:
    paths:
      - ".github/workflows/inspect-drinks.yml"
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract drink-area markup
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          keys=["Drinks","DRINKS","Bebidas","BEBIDAS","Signature","SIGNATURE","Cocktails","COCKTAILS"]
          out=[]
          for k in keys:
              i=s.find(k)
              if i>=0:
                  out.append("KEY="+k+" INDEX="+str(i))
                  out.append(s[max(0,i-5000):min(len(s),i+12000)])
          out.append("\nALL IMG TAGS:\n")
          import re
          for m in re.finditer(r"<img[^>]*>",s,re.I):
              out.append(m.group(0)[:1000])
          Path("drink-inspect.txt").write_text("\n\n".join(out),encoding="utf-8")
          PY
      - name: Commit inspection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drink-inspect.txt
          git commit -m "Inspect drink image markup" || exit 0
          git push
