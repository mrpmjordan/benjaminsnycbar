name: Remove strip steak sandwich
on:
  push:
    paths:
      - ".github/workflows/remove-strip-steak-sandwich.yml"
permissions:
  contents: write
jobs:
  update-menu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove NYC Strip Steak Sandwich
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          target='<article class="food-card"><div><h3 class="food-name">NYC Strip Steak Sandwich</h3><p class="food-desc">Bife de chorizo, morrones, mayonesa y pan ciabatta.</p></div><div class="food-price" data-price="nyc_strip_steak_sandwich">$35.000</div></article>'
          if target in s:
              s=s.replace(target,"",1)
              p.write_text(s,encoding="utf-8")
          else:
              raise SystemExit("NYC Strip Steak Sandwich item not found")
          PY
      - name: Commit update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Remove NYC Strip Steak Sandwich from food menu"
            git push
          fi
