name: Update food photo
on:
  push:
    paths:
      - ".github/workflows/update-food-photo.yml"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace old food photos with new combined image
        shell: bash
        run: |
          set -e
          if [ -f "assets/foto girls food.jpg" ]; then
            mv "assets/foto girls food.jpg" "assets/benjamins-food-nyc-combined.jpg"
          fi
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          replacement = '''<section class="photo-preview-section" id="food-visual-preview">
          <span class="eyebrow">Benjamin's Kitchen</span>
          <div class="section-head"><div class="section-head-icon">📸</div><div><h2>From the Kitchen</h2></div></div>
          <div class="photo-preview-grid food-single" style="grid-template-columns:1fr !important;">
            <figure class="photo-card tall" style="grid-column:1/-1;min-height:420px;">
              <img alt="Benjamin's food selection with New York skyline" loading="lazy" src="assets/benjamins-food-nyc-combined.jpg">
            </figure>
          </div>
          </section>'''
          pat = r'<section class="photo-preview-section" id="food-visual-preview">.*?</section>'
          s2, n = re.subn(pat, replacement, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f"Expected one food photo section, found {n}")
          p.write_text(s2, encoding="utf-8")
          PY
          rm -f "index (3).html"
      - name: Commit website update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Replace old food photos with combined NYC food image"
            git push
          fi
